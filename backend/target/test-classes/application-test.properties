spring.datasource.url=jdbc:h2:mem:plagiarism_test;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
app.jwt.secret=test-secret-key-for-plagiarism-checker-app-min-32-characters
app.jwt.expiration-ms=3600000
app.similarity.threshold.moderate=40
app.similarity.threshold.high=70
app.seed.enabled=false
