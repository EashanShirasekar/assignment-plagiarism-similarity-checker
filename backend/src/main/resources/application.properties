# ===============================
# Server
# ===============================
server.port=8080

# ===============================
# MySQL Database
# Update these three values to match your local MySQL setup.
# The database itself (plagiarism_checker) will be created automatically
# if createDatabaseIfNotExist=true and the user has privileges.
# ===============================
spring.datasource.url=jdbc:mysql://localhost:3306/plagiarism_checker?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===============================
# JPA / Hibernate
# ddl-auto=update lets Hibernate create/update tables automatically from the
# entity classes, which is convenient for a college microproject.
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# ===============================
# JWT
# app.jwt.secret must be at least 256 bits (32+ characters) for HS256.
# Change this value before any real deployment.
# ===============================
app.jwt.secret=change-this-super-secret-key-for-plagiarism-checker-app-min-32-chars
app.jwt.expiration-ms=86400000

# ===============================
# Similarity thresholds (percentages)
# 0            .. moderate-1   -> LOW
# moderate     .. high-1       -> MODERATE
# high         .. 100          -> HIGH  (also flagged for review)
# ===============================
app.similarity.threshold.moderate=40
app.similarity.threshold.high=70

# ===============================
# Seed / demo data
# Set to false to skip inserting demo teachers/students/assignments on startup.
# ===============================
app.seed.enabled=true

# ===============================
# CORS - the React dev server origin
# ===============================
app.cors.allowed-origins=http://localhost:5173,http://localhost:3000
